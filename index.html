<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipoquetas</title>
  <!-- Ícones do Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #050505;
      color: #ffffff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      height: 60px;
      background-color: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #1c1c1c;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .menu-btn {
      font-size: 1.2rem;
      cursor: pointer;
      color: #fff;
    }

    .logo {
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .search-container {
      flex: 0 1 500px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 8px 75px 8px 16px;
      border-radius: 20px;
      border: 1px solid #333;
      background-color: #121212;
      color: #fff;
      outline: none;
      font-size: 0.9rem;
    }

    .search-icons {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 10px;
      color: #888;
      cursor: pointer;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .notification-icon {
      font-size: 1.2rem;
      cursor: pointer;
      color: #ccc;
    }

    .user-avatar {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid #8b1e22;
    }

    /* CONTAINER PRINCIPAL */
    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
    }

    /* SIDEBAR */
    aside {
      width: 65px;
      background-color: #0a0a0a;
      border-right: 1px solid #1c1c1c;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
    }

    .nav-icon {
      color: #777;
      font-size: 1.2rem;
      text-decoration: none;
      transition: color 0.2s;
      cursor: pointer;
    }

    .nav-icon:hover, .nav-icon.active {
      color: #ffffff;
    }

    /* ÁREA DE CONTEÚDO */
    main {
      flex: 1;
      padding: 20px 30px;
      overflow-y: auto;
    }

    /* BANNER DE DESTAQUE */
    .hero-banner {
      width: 100%;
      height: 280px;
      border-radius: 8px;
      background: linear-gradient(rgba(0,0,0,0.2), #050505), url('https://picsum.photos/1200/400?sig=1') center/cover;
      display: flex;
      align-items: center;
      padding: 30px;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
      margin-bottom: 25px;
    }

    .hero-title {
      font-size: 2.5rem;
      font-weight: bold;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
    }

    /* CATEGORIAS (TAGS VERMELHAS) */
    .categories-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 30px;
      padding-bottom: 5px;
    }

    .category-btn {
      background-color: #8b1e22;
      color: #fff;
      border: none;
      padding: 8px 22px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s;
    }

    .category-btn:hover {
      background-color: #a8252a;
    }

    .nav-arrow-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 5px;
    }

    /* SESSÃO RECOMENDADOS */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .slider-controls {
      display: flex;
      gap: 8px;
    }

    .slider-btn {
      background-color: #1a1a1a;
      border: 1px solid #333;
      color: #fff;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* GRID DE CARDS */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
    }

    .movie-card {
      background-color: #121212;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 2 / 3;
      border: 1px solid #222;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .movie-card:hover {
      transform: translateY(-4px);
      border-color: #8b1e22;
    }

    .movie-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="header-left">
      <i class="fa-solid fa-bars menu-btn"></i>
      <div class="logo">PIPOQUETAS</div>
    </div>

    <div class="search-container">
      <input type="text" class="search-input" placeholder="Procure Filmes, Atores, Perfis e Críticos" />
      <div class="search-icons">
        <i class="fa-solid fa-sliders"></i>
        <i class="fa-solid fa-magnifying-glass"></i>
      </div>
    </div>

    <div class="header-right">
      <i class="fa-regular fa-bell notification-icon"></i>
      
    </div>
  </header>

  <!-- ESTRUTURA LATERAL + CONTEÚDO -->
  <div class="main-container">
    <!-- MENU LATERAL -->
    <aside>
      <div class="nav-group">
        <a class="nav-icon active"><i class="fa-solid fa-house"></i></a>
        <a class="nav-icon"><i class="fa-solid fa-globe"></i></a>
        <a class="nav-icon"><i class="fa-solid fa-cube"></i></a>
        <a class="nav-icon"><i class="fa-regular fa-heart"></i></a>
        <a class="nav-icon"><i class="fa-solid fa-list-check"></i></a>
        <a class="nav-icon"><i class="fa-regular fa-folder"></i></a>
      </div>

      <div class="nav-group">
        <a class="nav-icon"><i class="fa-regular fa-star"></i></a>
        <a class="nav-icon"><i class="fa-solid fa-gear"></i></a>
        <a class="nav-icon"><i class="fa-solid fa-right-from-bracket"></i></a>
      </div>
    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main>
      <!-- Destaque -->
      <section class="hero-banner">
        <h1 class="hero-title">JURASSIC PARK</h1>
      </section>

      <!-- Categorias -->
      <section class="categories-bar">
        <button class="category-btn">Ação</button>
        <button class="category-btn">Animação</button>
        <button class="category-btn">Aventura</button>
        <button class="category-btn">Comédia</button>
        <button class="category-btn">Drama</button>
        <button class="category-btn">Sci-Fi</button>
        <button class="category-btn">Fantasia</button>
        <button class="category-btn">Romance</button>
        <button class="category-btn">Crime</button>
        <button class="category-btn">Música</button>
        <button class="nav-arrow-btn"><i class="fa-solid fa-arrow-right"></i></button>
      </section>

      <section>
        <div class="section-header">
          <h2 class="section-title">Recomendados para você</h2>
          <div class="slider-controls">
            <button class="slider-btn"><i class="fa-solid fa-arrow-left"></i></button>
            <button class="slider-btn"><i class="fa-solid fa-arrow-right"></i></button>
          </div>
        </div>

        <div class="cards-grid">
          <div class="movie-card"><img alt="Duna" /></div>
          <div class="movie-card"><img alt="Interstellar" /></div>
          <div class="movie-card"><img alt="Guerra Civil" /></div>
          <div class="movie-card"><img alt="1917" /></div>
          <div class="movie-card"><img alt="Blade Runner 2049" /></div>
          <div class="movie-card"><img alt="Titanic" /></div>
          <div class="movie-card"><img alt="Spider-Man" /></div>
        </div>
      </section>
    </main>
  </div>

</body>
</html>
